name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: dispatch
          POSTGRES_DB: dispatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dispatch -d dispatch_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://dispatch:dispatch@localhost:5432/dispatch_test
      TEST_DATABASE_URL: postgresql+asyncpg://dispatch:dispatch@localhost:5432/dispatch_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -v --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build --detach --wait --wait-timeout 120
      - run: curl --fail --silent --show-error http://localhost:8000/ready
      - name: data endpoints require the API key
        run: |
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8000/v1/jobs)
          [ "$code" = "401" ] || { echo "expected 401 without X-API-Key, got $code"; exit 1; }
      - name: round-trip a dispatch run through the worker
        env:
          KEY: "X-API-Key: dev-local-key"
        run: |
          run_id=$(curl --fail --silent -H "$KEY" -X POST http://localhost:8000/v1/dispatch-runs | jq -r .id)
          for _ in $(seq 1 30); do
            status=$(curl --fail --silent -H "$KEY" "http://localhost:8000/v1/dispatch-runs/$run_id" | jq -r .status)
            [ "$status" = "succeeded" ] && exit 0
            [ "$status" = "failed" ] && { echo "dispatch run failed"; exit 1; }
            sleep 1
          done
          echo "dispatch run did not finish within 30s"; exit 1
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
